[project]
name = "asset-flow-server"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "flask_cors==6.0.5",
    "sqlalchemy==2.0.51",
    "yfinance==1.5.1",
    "pandas==3.0.3",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "feedparser==6.0.12",
    "apscheduler==3.11.3",
    "pytz==2026.2",
    "gunicorn==26.0.0",
    "pandas_market_calendars==5.4.0",
    "tenacity==9.1.4",
    "alembic==1.18.5",
    "requests==2.34.2",
    "pymupdf==1.28.0",
    "reportlab==5.0.0",
    "google-genai==3.6.1",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
